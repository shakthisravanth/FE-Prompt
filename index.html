.commands{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;border:1px solid var(--line);border-radius:6px;margin:12px 0 16px}

<script>
'use strict';
const content=document.getElementById('content');
const announcement=document.getElementById('announcement');
const themeToggle=document.getElementById('theme-toggle');
const themeLabel=document.getElementById('theme-label');
function syncThemeButton(){
 const dark=document.documentElement.dataset.theme==='dark';
 themeLabel.textContent=dark?'Light mode':'Dark mode';
 themeToggle.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');
}
themeToggle.addEventListener('click',()=>{
 const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
 document.documentElement.dataset.theme=next;
 try{localStorage.setItem('prompt-page-theme',next);}catch(e){}
 syncThemeButton();
});
syncThemeButton();
function selectText(node){const range=document.createRange();range.selectNodeContents(node);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);}
function fallbackCopy(text){const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.left='-9999px';area.style.top='0';area.style.fontSize='16px';document.body.append(area);area.focus();area.select();area.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy');}catch{}finally{area.remove();}return ok;}
async function copyPrompt(text,button,block){let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true;}}catch{}if(!ok)ok=fallbackCopy(text);if(ok){button.textContent='Copied!';button.dataset.copied='true';announcement.textContent='Prompt copied.';button.focus({preventScroll:true});}else{selectText(block);button.textContent='Select & copy';announcement.textContent='Clipboard unavailable. Prompt selected; use your browser to copy.';}clearTimeout(button._reset);button._reset=setTimeout(()=>{button.textContent='Copy Prompt';delete button.dataset.copied;},2000);}
function render(){
 const route=location.hash.replace(/^#\/?/,'').replace(/\/$/,'') || 'st-4.1';
 const page=/^st-4\.[1-6]$/.test(route)?document.getElementById(route):null;
 content.replaceChildren();
 announcement.textContent='';
 if(!page){const p=document.createElement('p');p.textContent='Open the prompt page link shared with you.';content.append(p);return;}
 content.append(page.content.cloneNode(true));
 content.querySelectorAll('.prompt-box').forEach(box=>{const button=box.querySelector('.copy');const block=box.querySelector('.prompt-text');button.addEventListener('click',()=>copyPrompt(block.textContent,button,block));});
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
render();
</script>
